name: Build

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/PinToDeck/PinToDeck.csproj

    - name: Build
      run: dotnet build src/PinToDeck/PinToDeck.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test tests/PinToDeck.Tests/PinToDeck.Tests.csproj --no-build --configuration Release --verbosity normal
